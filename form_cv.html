<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <link rel="stylesheet" href="style/Estilos.css">
</head>
<body>

    <!--ENCABEZADO-->
    <header class="header">

        <!--LOGO DE TALENTCONNECT-->
        <div class="logo">
            <img 
            src="https://res.cloudinary.com/khmdjqfb/image/upload/v1793869399/logo.png"
            alt="TalentConnect"
            class="logoTalentConnect"
            >
        </div>

        <!--MENÚ SELECCIÓN-->
        <nav class="menu">

            <a href="PaginaWeb.html">Inicio</a>

            <a href="empleos.html">Empleos</a>

            <a href="form_cv.html">Subir CV</a>

            <a href="empresas.html">Empresas</a>

            <a href="#contacto" class="contact">CONTÁCTANOS</a>

        </nav>
    </header>

    <!--LÍNEA DE SEPARACIÓN-->
    <hr class="separador">
    
    <!--SECCIÓN DE FORMULARIO PARA CREAR CV-->
    <section class="seccion_cv">

        <h1>Construye tu CV</h1>

        <p class="info_cv">
            Completa tus datos personales para comenzar a crear tu perfil profesional en TalentConnect.
        </p>

        <!-- EMPIEZA FORMULARIO -->
        <form id="formularioCV" onsubmit="validarFormulario(event)">

            <!-- INFORMACIÓN PERSONAL-JARA-ASIER-->
            <h2>Información personal</h2>

            <div class="campos_cv">

                <!-- PRIMERA FILA: NOMBRES Y APELLIDOS-->
                <div class="campo_cv">
                    <label for="nombre">Nombre*</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required>
                </div>

                <div class="campo_cv">
                    <label for="apellidos">Apellidos*</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Introduce tus apellidos" required>
                </div>

                <!-- SEGUNDA FILA: DNI Y CORREO-->
                <div class="campo_cv">
                    <label for="DNI">DNI*</label>
                    <input type="text" id="DNI" name="DNI" placeholder="Introduce tu DNI" required>
                </div>

                <div class="campo_cv">
                    <label for="correo_electronico">Correo Electrónico*</label>
                    <input type="text" id="correo_electronico" name="correo_electronico" placeholder="Introduce tu correo electronico" required>
                </div>

                <!-- TERCERA FILA:TELEFONO Y DIRECCION-->
                <div class="campo_cv">
                    <label for="telefono">Telefono*</label>
                    <input type="text" id="telefono" name="telefono" placeholder="Introduce tu telefono" required>
                </div>

                <div class="campo_cv">
                    <label for="direccion">Dirección*</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Introduce tu dirección" required>
                </div>

            </div>
            
            <!-------------------------------------------------------------------------------->

            <!-- FORMACIÓN ACADEMICA - MIKEL-->
            <h2>Formación académica</h2>

            <div class="campos_cv">

                <!--SELECT PARA ELEGIR OPCIONES DE NIVEL DE ESTUDIOS -->
                <div class="campo_cv">
                    <label for="nivel_estudios">Nivel de estudios*</label>
                    <select id="nivel_estudios" name="nivel_estudios" required>
                        <option value="">Selecciona tu nivel</option>
                        <option value="ESO">ESO</option>
                        <option value="Bachillerato">Bachillerato</option>
                        <option value="Grado Medio">Grado Medio</option>
                        <option value="Grado Superior">Grado Superior</option>
                        <option value="Universidad">Universidad</option>
                    </select>
                </div>
                
                <!--AQUI INTRODUCES LOS ESTUDIOS REALIZADOS -->
                <div class="campo_cv">
                    <label for="estudios">Estudios realizados*</label>
                    <input type="text" id="estudios" name="estudios" placeholder="Ej: DAM" required>
                </div>

                <!--AQUI INTRODUCES EL CENTRO EDUCATIVO-->
                <div class="campo_cv">
                    <label for="centro">Centro educativo*</label>
                    <input type="text" id="centro" name="centro" placeholder="Nombre del centro educativo" required>
                </div>
 
            </div>
            
            <!--EN ESTE CAMPO MEDIANTE DATE, AÑADIMOS FECHA INICIO /FIN-->
            <div class="campos_cv">

                <div class="campo_cv">
                    <label for="fecha_inicio_estudios">Año de inicio*</label>
                    <input type="date" id="fecha_inicio_estudios" name="fecha_inicio_estudios" required>
                </div>

                <div class="campo_cv">
                    <label for="fecha_fin_estudios">Año de finalización</label>
                    <input type="date" id="fecha_fin_estudios" name="fecha_fin_estudios">
                </div>

            </div>

            <!-- EXPERIENCIA LABORAL -->
            <h2>Experiencia laboral</h2>

            <div class="campos_cv">
                
                <!--AQUI AÑADIMOS NOMBRE DEL PUESTO DE TRABAJO-->
                <div class="campo_cv">
                    <label for="puesto">Puesto de trabajo</label>
                    <input type="text" id="puesto" name="puesto" placeholder="Ej: Programador Junior">
                </div>

                <!--AQUI EL NOMBRE DE LA EMPRESA-->
                <div class="campo_cv">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" name="empresa" placeholder="Nombre de la empresa">
                </div>

            </div>

            <!--AQUI LA FECHA INICIO /FIN MEDIANTE DATE -->
            <div class="campos_cv">

                <div class="campo_cv">
                    <label for="fecha_inicio_trabajo">Fecha de inicio</label>
                    <input type="date" id="fecha_inicio_trabajo" name="fecha_inicio_trabajo">
                </div>

                <div class="campo_cv">
                    <label for="fecha_fin_trabajo">Fecha de finalización</label>
                    <input type="date" id="fecha_fin_trabajo" name="fecha_fin_trabajo">
                </div>

            </div>

            <!--Y AQUI UNA DESCRIPCION DE PUESTO-->
            <div class="campos_cv">

                <div class="campo_cv">
                    <label for="descripcion">Descripción del puesto</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Describe las tareas que realizabas"></textarea>
                </div>

            </div>
            
            <!---HABILIDADES-XABIER-->
            <h2>Habilidades</h2>

            <div class="campos_cv">
                
                <!--Se utiliza el checkbox para multiples opciones-->
                <div class="campo_cv">
                    <label>Softskills</label>
                    <div class="opciones_multiples">
                        <label><input type="checkbox" name="softskills" value="trabajo_equipo"> Trabajo en equipo</label><br>
                        <label><input type="checkbox" name="softskills" value="comunicacion"> Comunicación</label><br>
                        <label><input type="checkbox" name="softskills" value="liderazgo"> Liderazgo</label><br>
                        <label><input type="checkbox" name="softskills" value="resolucion_problemas"> Resolución de problemas</label><br>
                        <label><input type="checkbox" name="softskills" value="adaptabilidad"> Adaptabilidad</label>
                        <!--En caso de tener otras sfotskills-->
                        <textarea name="otras_softskills" class="textarea_otros" placeholder="Otras softskills..."></textarea>
                    </div>
                </div>

                <!--Se utiliza el checkbox para multiples opciones-->
                <div class="campo_cv">
                    <label>Softwares</label>
                    <div class="opciones_multiples">
                        <label><input type="checkbox" name="softwares" value="vsCode"> VS Code</label><br>
                        <label><input type="checkbox" name="softwares" value="git_gitHub"> Git / GitHub</label><br>
                        <label><input type="checkbox" name="softwares" value="notepad">Notepad++</label><br>
                        <label><input type="checkbox" name="softwares" value="SQL">SQL</label>
                        <!--En caso de tener otras sfowares-->
                        <textarea name="otros_softwares" class="textarea_otros" placeholder="Otros programas..."></textarea>
                    </div>
                </div>

            </div>

            <div class="campos_cv">
                <!--Desplegable para elegir el idioma principal-->
                <div class="campo_cv">
                    <label for="idioma">Idioma</label>
                    <select id="idioma" name="idioma">
                        <option value="">Selecciona un idioma</option>
                        <option value="ingles">Inglés</option>
                        <option value="frances">Francés</option>
                        <option value="aleman">Alemán</option>
                        <option value="euskera">Euskera</option>
                        <option value="español">Español</option>
                    </select>
                </div>
                <!--Uso de botones para elegir una opcion entre los diferentes niveles de idioma-->
                <div class="campo_cv">
                    <label>Nivel de idioma</label>
                    <div class="opciones_multiples espaciado_radios">
                        <label><input type="radio" name="nivel_idioma" value="basico" > Básico (A1-A2)</label><br>
                        <label><input type="radio" name="nivel_idioma" value="intermedio"> Intermedio (B1-B2)</label><br>
                        <label><input type="radio" name="nivel_idioma" value="avanzado"> Avanzado (C1-C2)</label><br>
                        <label><input type="radio" name="nivel_idioma" value="nativo"> Bilingüe / Nativo</label>
                    </div>
                </div>

            </div>

            <!-- ÚLTIMA FILA: BOTÓN -->
            <div class="contenedor_boton">
                <button type="submit" class="boton_enviar">
                    ENVIAR
                </button>
            </div>

        </form>

    </section>

    <!-- VINCULACIÓN CON JAVASCRIPT -->
    <script src="javascript/form.js"></script>

</body>
</html>
